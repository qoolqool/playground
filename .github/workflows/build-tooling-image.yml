name: Build & Push Tooling Image

on:
  push:
    branches: [main]
    paths:
      - 'tooling/Dockerfile'
      - 'tooling/config/**'
      - 'tooling/scripts/**'
      - 'tooling/extensions/**'
      - 'tooling/entrypoint-wrapper.sh'
      - 'tooling/skill-marketplace/**'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional tag override (e.g., "staging")'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-tooling

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYYMMDD-HHMM'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./tooling
          file: ./tooling/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
