version: 2
updates:
  # GitHub Actions — keep workflow action versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Docker — scan the base image (FROM debian:trixie-slim)
  - package-ecosystem: "docker"
    directory: "/tooling"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"
